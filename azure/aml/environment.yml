# Azure ML environment for YOLOv8m coach training (CUDA).
# Register once, then reference from job_yolov8m.yml:
#   az ml environment create -f azure/aml/environment.yml -g $RG -w $WS

$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: atcr-yolov8-train
version: "1"
description: Ultralytics YOLOv8 training with CUDA PyTorch for ATCR
image: mcr.microsoft.com/azureml/openmpi4.1.0-cuda11.8-cudnn8-ubuntu22.04:latest
conda_file:
  channels:
    - conda-forge
  dependencies:
    - python=3.10
    - pip
    - pip:
        - ultralytics>=8.3.0
        - torch>=2.2.0
        - torchvision>=0.17.0
        - opencv-python-headless>=4.10.0
        - numpy>=1.26.0
        - pillow>=10.4.0
        - pyyaml>=6.0.0
        - tqdm>=4.66.0
        - azure-storage-blob>=12.19.0
